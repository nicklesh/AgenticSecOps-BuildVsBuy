<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img">
<title>CSPM agent architecture</title>
<desc>Cloud APIs feed into Prowler scanning, which feeds a Claude-based triage agent, which branches into a human-reviewed draft PR and a drift digest report.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<line x1="340" y1="96" x2="340" y2="140" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="196" x2="340" y2="240" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M340 296 L340 318 L165 318 L165 340" fill="none" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M340 296 L340 318 L525 318 L525 340" fill="none" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Cloud APIs -->
<rect x="250" y="40" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Cloud APIs</text>
<text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">AWS / Azure / GCP</text>

<!-- Prowler scan -->
<rect x="250" y="140" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="160" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Prowler scan</text>
<text x="340" y="178" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">CIS benchmark checks</text>

<!-- Triage agent -->
<rect x="250" y="240" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="260" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Triage agent</text>
<text x="340" y="278" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">Claude Sonnet 5</text>

<!-- Draft PR -->
<rect x="70" y="340" width="190" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="165" y="360" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">Draft PR</text>
<text x="165" y="378" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#854F0B">Human review required</text>

<!-- Drift digest -->
<rect x="430" y="340" width="190" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="525" y="360" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Drift digest</text>
<text x="525" y="378" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Slack / email</text>
</svg>
